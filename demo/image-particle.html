<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KineticOS — Image Particle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; font-family: system-ui, sans-serif; }
    .section {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 3rem); font-weight: 700; }
    p { margin-top: 1rem; opacity: 0.5; }
    code { font-family: monospace; background: rgba(0,0,0,.08);
           padding: 0.2em 0.5em; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>

  <section class="section">
    <div ko-effect="image-particle"
         ko-src="./assets/logo.svg"
         ko-physics="medium">
    </div>
    <div class="content">
      <h1>Image Particle</h1>
      <p>Dithered SVG → interactive particle field</p>
      <p><code>ko-effect="image-particle" ko-src="./assets/logo.svg"</code></p>
    </div>
  </section>

  <script type="module"
    src="../packages/core/dist/kineticos.min.js"
    kineticos>
  </script>
</body>
</html>
